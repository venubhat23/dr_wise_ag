# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes

  # The app's time zone is UTC (config.time_zone unset in application.rb), so
  # "7am" here means 7am UTC = 12:30pm IST, not 7am local. Using a cron
  # expression instead to actually land at 7:00am IST (UTC+5:30) every day.
  policy_renewal_reminders:
    class: PolicyRenewalReminderJob
    queue: default
    schedule: "30 1 * * *"

  # Same 7:00am IST slot as policy_renewal_reminders, offset by 15 minutes so
  # the two batches don't contend for the mail queue at the same instant.
  policy_expired_followups:
    class: PolicyExpiredFollowupJob
    queue: default
    schedule: "45 1 * * *"

# Development currently points at the same Railway Postgres as production
# (config/database.yml), so the same warmer needs to run here too or every
# local dashboard load pays the full cold-query cost.
development:
  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes

  # Registered here too so it's visible in /admin/jobs locally and so it can be
  # exercised manually (see PolicyRenewalReminderJob.perform_now in a console).
  # Still only fires once a day at 7am, and dev/prod share the same Postgres,
  # so if you're testing near 7am with real matching policies, it WILL send
  # real mail to real customers/agents - same as production.
  # The app's time zone is UTC (config.time_zone unset in application.rb), so
  # "7am" here means 7am UTC = 12:30pm IST, not 7am local. Using a cron
  # expression instead to actually land at 7:00am IST (UTC+5:30) every day.
  policy_renewal_reminders:
    class: PolicyRenewalReminderJob
    queue: default
    schedule: "30 1 * * *"

  # Same caveats as policy_renewal_reminders above - dev/prod share Postgres,
  # so this WILL send real mail if run near its scheduled time with real data.
  policy_expired_followups:
    class: PolicyExpiredFollowupJob
    queue: default
    schedule: "45 1 * * *"
