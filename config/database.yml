  database: drwisedb01_dev
  host: /var/run/postgresql
  username: <%= ENV['DEV_DB_USERNAME'] || `whoami`.strip %>

test:
  <<: *default
  database: drwisedb01_test
  host: /var/run/postgresql
  username: <%= ENV['DEV_DB_USERNAME'] || `whoami`.strip %>

production:
