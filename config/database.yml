default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  # Hardcoded to the Railway production DB per explicit request — local dev
  # now reads/writes the same database as production. No local Postgres
  # fallback; DATABASE_URL is ignored here on purpose.
  url: "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway"

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql:///insurebook_admin_test?host=/var/run/postgresql&user=mahadev-bhat" } %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway" } %>

# SolidCache configuration
cache:
  production:
    <<: *default
    url: <%= ENV["CACHE_DATABASE_URL"] || ENV.fetch("DATABASE_URL") { "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway" } %>

  development:
    <<: *default
    url: "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway"

  test:
    <<: *default
    url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql:///insurebook_admin_test?host=/var/run/postgresql&user=mahadev-bhat" } %>

# SolidQueue configuration
queue:
  production:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] || ENV.fetch("DATABASE_URL") { "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway" } %>

  development:
    <<: *default
    url: "postgresql://postgres:hvbFdFNIxQoViVqAGVmVbGeIFMQMhznP@hayabusa.proxy.rlwy.net:49021/railway"

  test:
    <<: *default
    url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql:///insurebook_admin_test?host=/var/run/postgresql&user=mahadev-bhat" } %>
