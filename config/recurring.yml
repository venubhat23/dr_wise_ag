# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes

  policy_renewal_reminders:
    class: PolicyRenewalReminderJob
    queue: default
    schedule: every day at 7am

# Development currently points at the same Railway Postgres as production
# (config/database.yml), so the same warmer needs to run here too or every
# local dashboard load pays the full cold-query cost.
development:
  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes

  # Registered here too so it's visible in /admin/jobs locally and so it can be
  # exercised manually (see PolicyRenewalReminderJob.perform_now in a console).
  # Still only fires once a day at 7am, and dev/prod share the same Postgres,
  # so if you're testing near 7am with real matching policies, it WILL send
  # real mail to real customers/agents - same as production.
  policy_renewal_reminders:
    class: PolicyRenewalReminderJob
    queue: default
    schedule: every day at 7am
