# ActiveStorage is not used in this application
# We use direct Cloudflare R2 uploads via R2Service
# This file is kept minimal for Rails framework compatibility

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Note: All file uploads are handled directly via R2Service
# See app/services/r2_service.rb and config/initializers/cloudflare_r2.rb

development:
  service: Disk
  root: <%= Rails.root.join("storage") %>

production:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Legacy service for existing blobs
local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

local_persistent:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: Disk
  root: <%= Rails.root.join("storage") %>
