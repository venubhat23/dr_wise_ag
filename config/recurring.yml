# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes

  notify_expired_policies:
    class: PolicyExpiryNotificationJob
    queue: default
    schedule: every day at 7am

# Not scheduled in development: dev points at the same Postgres as production
# (see note below), and running this locally would email real customers and
# agents every time a developer boots the server.
#
# Development currently points at the same Railway Postgres as production
# (config/database.yml), so the same warmer needs to run here too or every
# local dashboard load pays the full cold-query cost.
development:
  dashboard_cache_warmer:
    class: DashboardCacheWarmerJob
    queue: default
    schedule: every 3 minutes
